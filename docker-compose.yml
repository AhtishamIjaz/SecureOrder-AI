version: '3.8'

services:
  # Service 1: The Secure Vault (MCP Server)
  mcp-vault:
    build:
      context: .
      dockerfile: ./mcp_server/Dockerfile
    container_name: secureorder-mcp-vault
    ports:
      - "8000:8000"
    volumes:
      - ./mcp_server/data:/app/mcp_server/data
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_PATH=/app/mcp_server/data/orders.db
    networks:
      - secureorder-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Service 2: The Agent Interface (Streamlit + LangGraph)
  agent-brain:
    build:
      context: .
      dockerfile: ./agent_engine/Dockerfile
    container_name: secureorder-agent-brain
    ports:
      - "8501:8501"
    depends_on:
      mcp-vault:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - MCP_SERVER_URL=http://mcp-vault:8000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    env_file:
      - .env
    networks:
      - secureorder-network
    volumes:
      - ./agent_engine:/app/agent_engine

networks:
  secureorder-network:
    driver: bridge
services:
  # Service 1: The Secure Vault (MCP)
  mcp-vault:
    build: ./mcp_server
    ports:
      - "8000:8000"
    volumes:
      - ./mcp_server/data:/app/mcp_server/data
    environment:
      - PYTHONUNBUFFERED=1

  # Service 2: The Agent Interface (Streamlit + LangGraph)
  agent-brain:
    build: ./agent_engine
    ports:
      - "8501:8501"
    depends_on:
      - mcp-vault
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MCP_SERVER_URL=http://mcp-vault:8000
    env_file:
      - .env
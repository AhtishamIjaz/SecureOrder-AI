name: Python Tests & Linting

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r agent_engine/requirements.txt
          pip install -r mcp_server/requirements.txt
          pip install pytest flake8 black isort

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 agent_engine/src mcp_server/src main.py --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 agent_engine/src mcp_server/src main.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

      - name: Check code format with black
        run: |
          black --check agent_engine/src mcp_server/src main.py
        continue-on-error: true

      - name: Sort imports with isort
        run: |
          isort --check-only agent_engine/src mcp_server/src main.py
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          docker buildx build -f ./Dockerfile -t secureorder-ai:test .
          docker buildx build -f ./agent_engine/Dockerfile -t secureorder-agent-brain:test .
          docker buildx build -f ./mcp_server/Dockerfile -t secureorder-mcp-vault:test .

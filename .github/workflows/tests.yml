name: Python Tests & Linting

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build main Docker image
        run: |
          docker buildx build -f ./Dockerfile -t secureorder-ai:test .

      - name: Build agent-brain Docker image
        run: |
          docker buildx build -f ./agent_engine/Dockerfile -t secureorder-agent-brain:test .

      - name: Build mcp-vault Docker image
        run: |
          docker buildx build -f ./mcp_server/Dockerfile -t secureorder-mcp-vault:test .

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Lint with flake8
        run: |
          flake8 agent_engine/src mcp_server/src main.py --count --select=E9,F63,F7,F82 --show-source --statistics || true
          flake8 agent_engine/src mcp_server/src main.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || true

      - name: Check code format with black
        run: |
          black --check agent_engine/src mcp_server/src main.py || true

      - name: Sort imports with isort
        run: |
          isort --check-only agent_engine/src mcp_server/src main.py || true


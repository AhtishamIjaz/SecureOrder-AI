name: Docker Hub Push

on:
  push:
    branches:
      - main
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push main Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/secureorder-ai:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/secureorder-ai:${{ github.sha }}

      - name: Build and push agent-brain image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./agent_engine/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/secureorder-agent-brain:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/secureorder-agent-brain:${{ github.sha }}

      - name: Build and push mcp-vault image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./mcp_server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/secureorder-mcp-vault:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/secureorder-mcp-vault:${{ github.sha }}

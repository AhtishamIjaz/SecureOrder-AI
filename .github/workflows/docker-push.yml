name: Docker Hub Push

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'agent_engine/**'
      - 'mcp_server/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'requirements.txt'
      - '.github/workflows/docker-push.yml'

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Build and push main Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_HUB_USERNAME }}/secureorder-ai:latest
            ${{ env.DOCKER_HUB_USERNAME }}/secureorder-ai:${{ github.sha }}

      - name: Build and push agent-brain image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./agent_engine/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_HUB_USERNAME }}/secureorder-agent-brain:latest
            ${{ env.DOCKER_HUB_USERNAME }}/secureorder-agent-brain:${{ github.sha }}

      - name: Build and push mcp-vault image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./mcp_server/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_HUB_USERNAME }}/secureorder-mcp-vault:latest
            ${{ env.DOCKER_HUB_USERNAME }}/secureorder-mcp-vault:${{ github.sha }}

      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}
          repository: ${{ env.DOCKER_HUB_USERNAME }}/secureorder-ai
          short-description: "AI Agent for Secure Orders"
          readme-filepath: ./README.md
